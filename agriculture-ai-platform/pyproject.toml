[tool.poetry]
name = "agriculture-ai-platform"
version = "1.0.0"
description = "AI-Powered Agriculture Platform for Crop Disease Detection and Smart Farming"
authors = ["Agriculture AI Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"

# Web Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"

# Database
sqlalchemy = "^2.0.23"
asyncpg = "^0.29.0"
alembic = "^1.12.1"
redis = "^5.0.1"

# ML/Data Science
torch = "^2.1.0"
torchvision = "^0.16.0"
transformers = "^4.35.0"
scikit-learn = "^1.3.2"
pandas = "^2.1.3"
numpy = "^1.26.2"
opencv-python = "^4.8.1.78"
pillow = "^10.1.0"

# Computer Vision
segmentation-models-pytorch = "^0.3.3"
ultralytics = "^8.0.200"
grad-cam = "^1.4.8"

# Knowledge Graph
neo4j = "^5.14.0"
py2neo = "^2021.2.4"

# NLP/LLM
langchain = "^0.0.340"
sentence-transformers = "^2.2.2"
tokenizers = "^0.15.0"

# MLOps
mlflow = "^2.8.1"
prefect = "^2.14.5"
great-expectations = "^0.18.4"

# Monitoring
prometheus-client = "^0.19.0"
structlog = "^23.2.0"

# Utilities
python-dotenv = "^1.0.0"
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.25.2"
aiofiles = "^23.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
pre-commit = "^3.6.0"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
