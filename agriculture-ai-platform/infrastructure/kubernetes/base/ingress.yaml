apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agriculture-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  tls:
  - hosts:
    - api.agriculture-ai.com
    - ml.agriculture-ai.com
    secretName: agriculture-tls
  rules:
  - host: api.agriculture-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agriculture-api-service
            port:
              number: 80
  - host: ml.agriculture-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agriculture-ml-service
            port:
              number: 80
