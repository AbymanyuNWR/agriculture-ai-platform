name: Model Training

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: 'Dataset version to use'
        required: true
        default: 'latest'
      model_type:
        description: 'Model type to train'
        required: true
        default: 'disease_classifier'
        type: choice
        options:
        - disease_classifier
        - pest_detector
        - crop_recommender

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    
    - name: Configure MLflow
      run: |
        export MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
    
    - name: Run training pipeline
      run: |
        poetry run python -m src.ml.pipelines.training_pipeline \
          --model-type ${{ github.event.inputs.model_type }} \
          --dataset-version ${{ github.event.inputs.dataset_version }}
    
    - name: Evaluate model
      run: |
        poetry run python -m src.ml.evaluation.evaluate_model \
          --model-type ${{ github.event.inputs.model_type }}
    
    - name: Register model
      run: |
        poetry run python -m src.ml.registry.register_model \
          --model-type ${{ github.event.inputs.model_type }}
